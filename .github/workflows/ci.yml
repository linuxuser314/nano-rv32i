name: RISC-V CI

on:
  push:
  pull_request:

jobs:
  test-in-codespace-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Tests in Devcontainer
        uses: devcontainers/ci@v0.3
        with:
          # Define the registry and image name
          imageName: ghcr.io/${{ github.repository }}/nano-rv32i-env
          
          # Use the registry image as a cache
          cacheFrom: ghcr.io/${{ github.repository }}/nano-rv32i-env
          
          # Push the built image back to the registry for caching
          push: always
          
          runCmd: |
            setup-basic
            lint
            synthesize
            test-dynamic

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codespace-test-logs
          path: logs/