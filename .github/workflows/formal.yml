name: RISC-V Formal Verification

on:
  push:
    paths:
      # RTL and Hardware Logic
      - 'rtl/**'
      - 'rvfi_wrapper.sv'
      - 'filelist.f'
      
      # Formal Setup & Configurations
      - 'checks.cfg'
      - 'tests/**'
      - 'tools/**'
      
      # Workflow itself
      - '.github/workflows/formal.yml'

  pull_request:
    paths:
      - 'rtl/**'
      - 'rvfi_wrapper.sv'
      - 'filelist.f'
      - 'checks.cfg'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/formal.yml'

jobs:
  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DEVCONTAINER_PUSH_PULL }}

      - name: Run Formal Verification in Devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/nano-rv32i-env
          push: always
          runCmd: |
            setup-basic
            test-formal

      - name: Upload Formal Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-verification-logs
          path: |
            logs/
            tests/